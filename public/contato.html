<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Hotel Aurora</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header><div class="container topbar"><div class="brand"><h1>Hotel Aurora</h1></div><nav><a href="index.html">Home</a><a href="quartos.html">Quartos</a><a href="login.html">Login</a></nav></div></header>
  <main class="container auth-layout">
    <section class="auth-card">
      <h2>Fale conosco</h2>
      <form id="contactForm">
        <div class="form-group"><label for="name">Nome</label><input id="name"></div>
        <div class="form-group"><label for="email">Email</label><input id="email" type="email"></div>
        <div class="form-group"><label for="subject">Assunto</label><input id="subject"></div>
        <div class="form-group"><label for="message">Mensagem</label><textarea id="message"></textarea></div>
        <button class="btn" type="submit">Enviar</button>
        <div id="msg" class="message error"></div>
      </form>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/contato.js"></script>
</body>
</html>
