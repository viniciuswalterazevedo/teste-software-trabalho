<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva | Hotel Aurora</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header><div class="container topbar"><div class="brand"><h1>Hotel Aurora</h1><p>Confirmar hospedagem</p></div><nav><a href="home.html">Inicio</a><a href="quartos.html">Quartos</a><a href="minhas-reservas.html">Minhas Reservas</a><button id="logoutBtn">Sair</button></nav></div></header>
  <main class="container">
    <section class="page-title"><h2>Finalizar reserva</h2><p>Confira o resumo e confirme sua hospedagem.</p></section>
    <section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <article class="card" id="summary"><h3>Resumo</h3><p class="meta">Carregando dados...</p></article>
      <article class="card">
        <h3>Confirmacao</h3>
        <form id="reservationForm">
          <div class="form-group"><label for="notes">Observacoes</label><textarea id="notes" placeholder="Opcional"></textarea></div>
          <button class="btn" type="submit">Confirmar Reserva</button>
          <div id="msg" class="message error"></div>
        </form>
      </article>
    </section>
  </main>
  <footer><p>2026 Hotel Aurora</p></footer>
  <script src="js/api.js"></script>
  <script src="js/reserva.js"></script>
</body>
</html>
