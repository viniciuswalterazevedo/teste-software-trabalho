<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelamento | Hotel Aurora</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header><div class="container topbar"><div class="brand"><h1>Hotel Aurora</h1><p>Cancelar reserva</p></div><nav><a href="home.html">Inicio</a><a href="minhas-reservas.html">Minhas Reservas</a><button id="logoutBtn">Sair</button></nav></div></header>
  <main class="container auth-layout">
    <section class="auth-card">
      <h2>Cancelar reserva</h2>
      <form id="cancelForm">
        <div class="form-group"><label for="code">Codigo da reserva</label><input id="code" type="text" placeholder="HTL-12345"></div>
        <button class="btn btn-danger" type="submit">Cancelar</button>
        <div id="msg" class="message error"></div>
      </form>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/cancelamento.js"></script>
</body>
</html>
